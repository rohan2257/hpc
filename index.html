<!DOCTYPE html>
<html>
<head>
  <title>HPC Demo</title>
</head>
<body>
  <h1>🚀 Matrix Multiplication (HPC Demo)</h1>

  <input id="size" type="number" value="100"/>
  <button onclick="run()">Run</button>

  <p id="result"></p>

  <script>
    async function run() {
      const n = document.getElementById("size").value;
      const res = await fetch(`/api/multiply?n=${n}`);
      const data = await res.json();

      document.getElementById("result").innerText =
        `Size: ${data.size}, Time: ${data.time} sec`;
    }
  </script>
</body>
</html>
